)</text><text x="660.0" y="218.6" text-anchor="middle" font-size="11" fill="#444">spherical k-means k=n/45</text><text x="660.0" y="236.6" text-anchor="middle" font-size="11" fill="#444">이상치 가드 (유사도 &lt; 0.45)</text><text x="660.0" y="254.6" text-anchor="middle" font-size="11" fill="#444">목적함수 J 회귀 게이트</text><rect x="800" y="110" width="130" height="76" rx="6" fill="#fff" stroke="#111" stroke-width="1.4"/><text x="865.0" y="134.6" text-anchor="middle" font-size="13" font-weight="600">GraphRAG 추천</text><text x="865.0" y="152.6" text-anchor="middle" font-size="11" fill="#444">선행관계 경로 점수</text><text x="865.0" y="170.6" text-anchor="middle" font-size="11" fill="#444">292/400 활성</text><line x1="150" y1="148" x2="185" y2="148" stroke="#111" stroke-width="1.3" marker-end="url(#a)"/><line x1="315" y1="148" x2="350" y2="148" stroke="#111" stroke-width="1.3" marker-end="url(#a)"/><line x1="520" y1="130" x2="560" y2="75" stroke="#111" stroke-width="1.3" marker-end="url(#a)"/><text x="526" y="96" text-anchor="middle" font-size="11" fill="#444">이전</text><line x1="520" y1="168" x2="560" y2="215" stroke="#111" stroke-width="1.3" marker-end="url(#a)"/><text x="528" y="205" text-anchor="middle" font-size="11" fill="#444">개선</text><line x1="760" y1="215" x2="800" y2="165" stroke="#111" stroke-width="1.3" marker-end="url(#a)"/><text x="20" y="260" font-size="12" font-weight="600" fill="#111">결과 (로컬 재구축 DB, 테스트 372개 통과)</text><text x="20" y="276" font-size="12" font-weight="400" fill="#111">coverage 0.34 → 0.999 · J 0.525 → 0.689 · 하위 주제 68개</text><g transform="translate(760,298)"><rect width="22" height="12" fill="#fff" stroke="#111" stroke-width="2.4" stroke-dasharray="6 3"/><text x="30" y="11" font-size="11" fill="#444">문제가 발생한 지점</text></g></svg>